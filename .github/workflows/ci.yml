name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[deep,dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check command-line entry point
        run: python -m ocd_v3 --help
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unittest-log
          path: unittest.log
          retention-days: 3
      - name: Run Ruff
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check src tests tools 2>&1 | tee ruff.log
      - name: Upload Ruff log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-log
          path: ruff.log
          retention-days: 3
      - name: Run repository check
        shell: bash
        run: |
          set -o pipefail
          python tools/repository_check.py --history 2>&1 | tee repository-check.log
      - name: Upload repository check log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-check-log
          path: repository-check.log
          retention-days: 3